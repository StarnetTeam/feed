name: Collect satellite feeds

on:
  workflow_dispatch:
  schedule:
    # Six daily windows, UTC. Collection starts immediately at each window.
    - cron: '0 12,14,16,18,20,22 * * *'

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    # Includes dependency installation, browser startup, jitter, and three group visits.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Collect and parse posts
        run: python -m app.main

      - name: Commit new JSON records
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/fids.json
          git diff --cached --quiet || git commit -m 'chore: update feed records'
          git push
